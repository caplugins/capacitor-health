<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Health Example</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
      }
      h1 {
        font-size: 1.4rem;
      }
      section {
        border: 1px solid #8884;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 8px;
      }
      pre {
        white-space: pre-wrap;
        margin: 8px 0 0;
      }
      pre[data-status='available'] {
        color: #1a7f37;
      }
      button {
        font: inherit;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@caplugins/capacitor-health</h1>
      <section>
        <h2>Availability</h2>
        <button id="check-availability" type="button">isAvailable()</button>
        <pre id="availability"></pre>
      </section>
    </main>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
