<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Health Example</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
      }
      h1 {
        font-size: 1.4rem;
      }
      section {
        border: 1px solid #8884;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 8px;
      }
      pre {
        white-space: pre-wrap;
        margin: 8px 0 0;
      }
      pre[data-status='error'] {
        color: #cf222e;
      }
      button {
        font: inherit;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@caplugins/capacitor-health</h1>
      <section>
        <h2>Availability</h2>
        <button id="check-availability" type="button">isAvailable()</button>
        <pre id="availability"></pre>
        <button id="supported-types" type="button">getSupportedTypes()</button>
        <pre id="supported"></pre>
      </section>
      <section>
        <h2>Permissions</h2>
        <button id="request-authorization" type="button">requestAuthorization()</button>
        <button id="check-authorization" type="button">checkAuthorization()</button>
        <pre id="authorization"></pre>
        <button id="open-settings" type="button">openHealthSettings()</button>
        <button id="open-install" type="button">openHealthConnectInstall()</button>
        <pre id="settings"></pre>
      </section>
      <section>
        <h2>Samples</h2>
        <button id="round-trip" type="button">Round-trip samples</button>
        <pre id="samples"></pre>
        <button id="changes-check" type="button">Check getChanges</button>
        <pre id="changes"></pre>
        <button id="period-check" type="button">Check periods</button>
        <button id="period-delete" type="button">Delete example period</button>
        <pre id="periods"></pre>
      </section>
      <section>
        <h2>Acceptance</h2>
        <button id="acceptance" type="button">Run acceptance (access granted)</button>
        <button id="acceptance-denied" type="button">Run acceptance (access denied)</button>
        <pre id="acceptance-output"></pre>
      </section>
    </main>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
