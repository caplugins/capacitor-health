<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Health Example</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
      }
      h1 {
        font-size: 1.4rem;
      }
      section {
        border: 1px solid #8884;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 8px;
      }
      pre {
        white-space: pre-wrap;
        margin: 8px 0 0;
      }
      pre[data-status='available'] {
        color: #1a7f37;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #spike-output {
        font-size: 11px;
        max-height: 50vh;
        overflow: auto;
      }
      button {
        font: inherit;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@caplugins/capacitor-health</h1>
      <section>
        <h2>Availability</h2>
        <button id="check-availability" type="button">isAvailable()</button>
        <pre id="availability"></pre>
      </section>
      <!-- M0 spike (removed in T10) -->
      <section id="spike">
        <h2>M0 spike: menstrualFlow</h2>
        <div class="grid">
          <button type="button" data-spike="auth">1 Request auth</button>
          <button type="button" data-spike="write5">2 Write 5 days</button>
          <button type="button" data-spike="rewrite5">3 Rewrite same 5</button>
          <button type="button" data-spike="bump">4 Day 3 → heavy v2</button>
          <button type="button" data-spike="read">5 Read all</button>
          <button type="button" data-spike="changes">6 Changes</button>
          <button type="button" data-spike="write6">7 Write day 6</button>
          <button type="button" data-spike="deleteLast">8 Delete last write</button>
          <button type="button" data-spike="raw">9 Raw values</button>
          <button type="button" data-spike="resetCursor">0 Reset cursor</button>
        </div>
        <pre id="spike-output"></pre>
      </section>
    </main>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
